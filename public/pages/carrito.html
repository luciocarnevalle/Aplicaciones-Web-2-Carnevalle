<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tu Carrito - Tenis Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header class="header-seccion text-center py-4">
        <div class="container">
            <h1 class="fw-bold">Mi Carrito</h1>
            <a href="productos.html" class="text-white opacity-75 ">Volver a la tienda</a>
        </div>
    </header>

    <main class="container my-5">
        <div id="carrito-vacio" class="text-center py-5" style="display: none;">
            <p class="lead mb-4">Tu carrito está vacío.</p>
            <a href="productos.html" class="btn btn-dark rounded-pill px-4">Ir a comprar algo</a>
        </div>

        <div id="carrito-productos-container" class="mb-4"></div>

        <div id="carrito-footer" class="card shadow-sm border-0 p-4" style="display: none;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0">Total:</h4>
                <span id="carrito-total-monto" class="precio-tag h3 mb-0">$0</span>
            </div>
            <div class="d-flex gap-2">
                <button id="btn-vaciar-carrito" class="btn btn-outline-danger rounded-pill">Vaciar Carrito</button>
                <button id="btn-comprar" class="btn btn-dark rounded-pill flex-grow-1">Finalizar Compra</button>
            </div>
        </div>
    </main>

    <script src="../js/carrito.js"></script>
</body>
</html>
