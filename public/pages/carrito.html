<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tu Carrito - Tenis Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header class="bg-light text-dark text-center py-4 border-bottom">
        <div class="container">
            <h1 class="fw-bold m-0 h3">🛒 Mi Carrito de Compras</h1>
        </div>
    </header>

    <main class="container my-5">
        <div id="carrito-vacio" class="text-center py-5" style="display: none;">
            <p class="lead mb-4">Tu carrito está vacío.</p>
            <a href="productos.html" class="btn btn-dark rounded-pill px-4">Ir a comprar algo</a>
        </div>

        <div id="carrito-productos-container" class="mb-4"></div>

        <div id="carrito-footer" class="card shadow-sm border-0 p-4" style="display: none;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                 <h4 class="mb-0">Total:</h4>
                <span id="carrito-total-monto" class="precio-tag h3 mb-0">$0</span>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <a href="productos.html" class="btn btn-outline-dark rounded-pill px-4">Seguir Comprando</a>
                    
                <button id="btn-vaciar-carrito" class="btn btn-outline-danger rounded-pill px-4">Vaciar Carrito</button>
                <button id="btn-comprar" class="btn btn-dark rounded-pill flex-grow-1">Finalizar Compra</button>
            </div>
        </div>
    </main>

        <div class="modal fade" id="modalExito" data-bs-backdrop="static" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg text-center p-4">
                <div class="modal-body">
                    <div class="display-1 text-success mb-3">🎉</div>
                    <h3 class="fw-bold text-dark mb-2">¡Compra Procesada!</h3>
                    <p class="text-secondary">Tu orden ha sido registrada con éxito en nuestro sistema.</p>
                    
                    <div class="bg-light rounded p-3 my-3">
                        <span class="text-muted small d-block">NÚMERO DE ORDEN</span>
                        <strong id="modal-orden-id" class="h4 text-dark">-</strong>
                    </div>
                    
                    <button type="button" class="btn btn-dark rounded-pill w-100 py-2 mt-2 text-uppercase" id="btn-modal-entendido">
                        Seguir Comprando
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../js/carrito.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/footer.js"></script>
</body>
</html>
