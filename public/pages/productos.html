<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tienda - Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header class="header-seccion text-center">
        <div class="container">
            <h1 class="display-4 fw-bold">Nuestros Productos</h1>
            <div class="mt-4" id="filtros">
                <button class="btn btn-outline-light rounded-pill mx-1" onclick="filtrar('todos')">Todos</button>
                <button class="btn btn-outline-light rounded-pill mx-1" onclick="filtrar('cuerdas')">Cuerdas</button>
                <button class="btn btn-outline-light rounded-pill mx-1" onclick="filtrar('raquetas')">Raquetas</button>
                <button class="btn btn-outline-light rounded-pill mx-1" onclick="filtrar('zapatillas')">Zapatillas</button>
            </div>
        </div>
    </header>

    <main class="container mb-5">
        <div id="lista" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>
    </main>

    <a href="carrito.html" 
        class="btn btn-dark position-fixed bottom-0 end-0 m-4 rounded-circle shadow-lg d-flex align-items-center justify-content-center" 
        style="width: 60px; height: 60px; z-index: 1000;">
        <span style="font-size: 24px;">🛒</span>
    </a>
    <script src="../js/productos.js"></script>
</body>
</html>
