<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Tienda Lucio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4 card p-4 shadow">
                <h2 class="text-center mb-4 fw-bold">Bienvenido</h2>
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="juan.perez@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" id="pass" class="form-control" placeholder="********" required>
                    </div>
                    <button type="submit" class="btn btn-dark w-100 rounded-pill">Ingresar</button>
                    <div id="error" class="text-danger mt-2 small text-center"></div>
                </form>
            </div>
        </div>
    </div>
    sc<script src="js/login.js"></script>
</body>
</html>
