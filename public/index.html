<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tenis Pro - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> 
</head>
<body class="login-body d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card-login p-5">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold mb-0">TENIS PRO</h2>
                        <hr class="mx-auto w-25 mb-4" style="border: 2px solid #2c3e50; opacity: 1;">
                    </div>
                    
                    <form id="loginForm">
                        <div class="mb-3 text-start">
                            <label class="form-label small">CORREO ELECTRÓNICO</label>
                            <input type="email" id="email" class="form-control" placeholder="usuario@correo.com" required>
                        </div>
                        <div class="mb-4 text-start">
                            <label class="form-label small">CONTRASEÑA</label>
                            <input type="password" id="pass" class="form-control" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-login w-100 py-3 rounded-pill text-uppercase">
                            Iniciar Sesión
                        </button>
                        <div id="error" class="text-danger mt-3 small text-center fw-bold"></div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="js/login.js"></script>

</body>
